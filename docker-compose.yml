services:
  # Backend API - Laravel (PHP-FPM)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schedule-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Student Schedule"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: schedule_app
      DB_USERNAME: root
      DB_PASSWORD: password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      MAIL_MAILER: log
      VITE_APP_NAME: "Student Schedule"
    volumes:
      - ./backend:/var/www/html:delegated
      - backend-vendor:/var/www/html/vendor
      - backend-node_modules:/var/www/html/node_modules
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    command: ["php-fpm"]

  # Nginx web server (proxies PHP to the app container)
  webserver:
    image: nginx:alpine
    container_name: schedule-webserver
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Database - MySQL 8.0
  db:
    image: mysql:8.0
    container_name: schedule-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: schedule_app
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis
  redis:
    image: redis:alpine
    container_name: schedule-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend - React Vite dev server
  frontend:
    build:
      context: ./frontend/hci-app
      dockerfile: Dockerfile
    container_name: schedule-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8081/api
      - HOST=0.0.0.0
      - PORT=5173
    volumes:
      - ./frontend/hci-app:/app:delegated
      - frontend-node_modules:/app/node_modules
    command: sh -c "npm install --ignore-scripts && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  backend-vendor:
  backend-node_modules:
  db-data:
  frontend-node_modules:
